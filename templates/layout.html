<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" content="">

<!-- theme: the visitor's saved choice, otherwise the system setting; set early to avoid a flash -->
<script>
  (function () {
    var root = document.documentElement;
    var system = window.matchMedia('(prefers-color-scheme: dark)');

    function chosen() {
      try { return localStorage.getItem('theme'); } catch (e) { return null; }
    }

    root.dataset.theme = chosen() || (system.matches ? 'dark' : 'light');

    // the pressed moon is the visitor's choice; with none made, neither
    function reflect() {
      var choice = chosen();
      document.querySelectorAll('[data-set-theme]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(choice === b.dataset.setTheme));
      });
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-set-theme]');
      if (!b) return;
      var choice = b.dataset.setTheme;
      if (chosen() === choice) {
        // a second press hands the choice back to the system
        try { localStorage.removeItem('theme'); } catch (e) {}
        root.dataset.theme = system.matches ? 'dark' : 'light';
      } else {
        root.dataset.theme = choice;
        try { localStorage.setItem('theme', choice); } catch (e) {}
      }
      reflect();
    });

    system.addEventListener('change', function (e) {
      if (!chosen()) root.dataset.theme = e.matches ? 'dark' : 'light';
    });

    // the buttons are replaced on each page change
    document.addEventListener('DOMContentLoaded', reflect);
    document.addEventListener('htmx:afterSettle', reflect);
  })();
</script>
<title>meditationposture.net</title>
{% load cache_busting %}

<!-- favicon: svg for current browsers, ico as a fallback -->
<link rel="icon" href="{% static_versioned 'images/favicon.ico' %}" sizes="48x48">
<link rel="icon" href="{% static_versioned 'images/favicon.svg' %}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{% static_versioned 'images/apple-touch-icon.png' %}">

<!-- set viewport for mobile devices -->
<meta name="viewport" content="width = device-width, initial-scale = 1">

<!-- preload background image -->
<link rel="preload" as="image" href="/static/images/misty-hills-bg.webp">

<!-- app stylesheets, versioned so browsers pick up changes -->
<link rel="stylesheet" href="{% static_versioned 'styles/colors.css' %}">
<link rel="stylesheet" href="{% static_versioned 'styles/styles.css' %}">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6CXHF54ENG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-6CXHF54ENG');
</script>

<!-- htmx and alpine; history navigation reloads the page so that the phone menu drawer starts closed -->
<meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
<script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
    integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"
    integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"
    onerror="document.documentElement.classList.remove('js')"></script>

<!-- the phone menu drawer needs alpine; without it the navigation stays below the article -->
<script>document.documentElement.classList.add('js');</script>

</head>

<!-- hx-boost: links load the next page without a full page reload -->
<body hx-boost="true">

<div class="container">

  <div class="content">

    <div class="content-left">

      <div class="panel-background">
        {% block content %}


        {% endblock content %}
      </div>

    </div>

    <div class="nav" x-data="{ open: false }" :class="open && 'open'"
        x-effect="document.body.style.overflow = open ? 'hidden' : ''"
        @keydown.escape.window="open = false">

      <!-- phones: a floating button opens the navigation as a drawer -->
      <button type="button" class="nav-toggle" aria-label="Open menu" aria-controls="site-nav"
          :aria-expanded="open" @click="open = true">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="nav-overlay" @click="open = false"></div>

      <div class="theme-switch">
        <button type="button" data-set-theme="light" aria-label="Light mode">
          <span class="moon moon-light"></span>
        </button>
        <button type="button" data-set-theme="dark" aria-label="Dark mode">
          <span class="moon moon-dark"></span>
        </button>
      </div>

      <div class="panel-background">
        <button type="button" class="nav-close" aria-label="Close menu" @click="open = false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        {% include 'nav.html' %}
      </div>

    </div>

  </div>

</div>

</body>
</html>
